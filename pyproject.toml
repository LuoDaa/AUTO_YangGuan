[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-yangguan"
version = "0.2.0"
description = "Conservative template-driven dental crown CAD MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "trimesh>=4.0",
  "shapely>=2.0",
  "networkx>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autocrown = "autocrown.cli:main"
autocrown-web = "autocrown.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
